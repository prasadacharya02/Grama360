openapi: 3.1.0
info:
  title: Grama360 API
  version: 1.0.0
  description: Versioned REST API shared by the Flutter app and future channels.
servers:
  - url: https://api.example.invalid/api/v1
    description: Replace with the deployed API host.
security:
  - FirebaseBearer: []
paths:
  /healthz:
    get:
      security: []
      summary: Liveness check
      responses:
        '200':
          description: API process is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      security: []
      summary: Readiness check
      responses:
        '200':
          description: API and database are ready.
        '503':
          description: Database is unavailable.
  /auth/session:
    post:
      summary: Sync a phone-authenticated Firebase identity to the application account.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                preferredLanguage:
                  type: string
                  enum: [en, kn]
      responses:
        '200':
          description: Account and onboarding state.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Phone verification required or account disabled.
        '409':
          description: Phone number is already linked to another account.
  /me:
    get:
      summary: Get the authenticated caller's own account and app roles.
      responses:
        '200':
          description: Caller account and roles.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session has not been synchronized yet.
  /me/roles:
    put:
      summary: Add a customer or provider role to the authenticated account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  type: string
                  enum: [CUSTOMER, PROVIDER]
      responses:
        '200':
          description: Updated role list and account state.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session has not been synchronized yet.
  /categories:
    get:
      security: []
      summary: List active localized service categories.
      parameters:
        - in: query
          name: language
          schema:
            type: string
            enum: [en, kn]
      responses:
        '200':
          description: Active category list with localized names.
        '400':
          description: Unsupported language code.
  /provider-profiles:
    post:
      summary: Create the authenticated provider's profile and submit it for review.
      description: The API verifies the provider role, uses the token owner, and sets PENDING_REVIEW. Review status and user ID cannot be supplied by the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderProfileInput'
      responses:
        '201':
          description: Created provider profile in PENDING_REVIEW status.
        '400':
          description: Invalid input, inactive category, or invalid profile photo path.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Provider role required or account disabled.
        '409':
          description: A provider profile already exists.
  /provider-profiles/me:
    get:
      summary: Read the authenticated provider's own profile and review status.
      description: Includes the latest provider-facing review note when available. This note is not present in public provider discovery responses.
      responses:
        '200':
          description: Caller-owned provider profile.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Provider role required or account disabled.
        '404':
          description: Provider profile has not been submitted.
    patch:
      summary: Update and resubmit an editable provider profile.
      description: Only DRAFT and REJECTED profiles can be edited. A successful update is returned to PENDING_REVIEW.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderProfileInput'
      responses:
        '200':
          description: Updated profile in PENDING_REVIEW status.
        '400':
          description: Invalid input or inactive service category.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Provider role required or account disabled.
        '404':
          description: Provider profile not found.
        '409':
          description: Profile is locked while pending, active, or suspended.
  /admin/me:
    get:
      summary: Read the enabled administrator role after recent MFA.
      description: Requires an enabled admin_users row with MFA enrollment, a Firebase second-factor claim, and auth_time within the preceding 15 minutes.
      responses:
        '200':
          description: Administrator role.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: An enabled administrator account with recorded MFA enrollment and recent second-factor authentication is required.
  /admin/provider-reviews:
    get:
      summary: List pending provider submissions.
      description: SUPPORT can read the queue; all roles require recent Firebase MFA.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
      responses:
        '200':
          description: Pending provider submissions and total queue count.
        '400':
          description: Invalid pagination values.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: An enabled administrator account with recorded MFA enrollment and recent second-factor authentication is required.
  /admin/provider-reviews/{providerId}/decision:
    post:
      summary: Approve or reject a pending provider profile.
      description: Only SUPER_ADMIN and MODERATOR may decide. Rejection requires a provider-facing note. The decision, verification record, profile status, and audit log are updated transactionally.
      parameters:
        - in: path
          name: providerId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderReviewDecisionInput'
      responses:
        '200':
          description: Review decision and resulting provider status.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Recent second-factor authentication, an enrolled enabled administrator account, and review permission are required.
        '404':
          description: Provider review was not found.
        '409':
          description: Provider is no longer pending or has an inconsistent verification state.
  /providers:
    get:
      summary: Search approved providers by service, text, and locality.
      description: Requires a signed-in account with the CUSTOMER role. Search and profile responses never contain a contact phone number.
      parameters:
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: q
          description: Provider, business, or service text; case-insensitive and supports English or Kannada.
          schema:
            type: string
            maxLength: 100
        - in: query
          name: location
          description: Matches a village/locality, taluk, or district in either stored language.
          schema:
            type: string
            maxLength: 100
        - in: query
          name: language
          schema:
            type: string
            enum: [en, kn]
            default: en
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
      responses:
        '200':
          description: Localized provider page with availability and aggregate review rating; no contact number.
        '400':
          description: One or more search filters are invalid.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Customer role required or account disabled.
  /providers/{providerId}:
    get:
      summary: Get an approved provider's public profile.
      description: Returns localized services, service area, availability, working hours and aggregate rating; never includes contact details.
      parameters:
        - in: path
          name: providerId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: language
          schema:
            type: string
            enum: [en, kn]
            default: en
      responses:
        '200':
          description: Public-safe provider profile.
        '400':
          description: Provider ID or language is invalid.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Customer role required or account disabled.
        '404':
          description: Provider is not approved or available.
  /providers/{providerId}/call-intent:
    post:
      summary: Record a call-button tap and return the verified number for the Android dialer.
      description: Requires the CUSTOMER role. The API rechecks active provider status and returns the number only to this authenticated call action. A tap is not evidence that a call completed.
      parameters:
        - in: path
          name: providerId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Call intent recorded; contains a phone number for launching the native dialer.
        '400':
          description: Provider ID is invalid.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Customer role required or account disabled.
        '404':
          description: Provider is not active or available for contact.
components:
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token; verified by the API with Firebase Admin.
  schemas:
    ProviderReviewDecisionInput:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        decisionNote:
          type: [string, 'null']
          maxLength: 1000
          description: Required for REJECT; shown to the provider in their own profile.
    ProviderProfileInput:
      type: object
      additionalProperties: false
      required:
        - displayName
        - serviceRadiusKm
        - experienceYears
        - serviceIds
        - languages
        - location
        - workingHours
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        businessName:
          type: [string, 'null']
          maxLength: 120
        secondaryPhoneNumber:
          type: [string, 'null']
          pattern: '^\+[1-9][0-9]{7,14}$'
        serviceRadiusKm:
          type: number
          minimum: 1
          maximum: 200
        experienceYears:
          type: integer
          minimum: 0
          maximum: 80
        description:
          type: [string, 'null']
          maxLength: 2000
        profilePhotoPath:
          type: [string, 'null']
          maxLength: 512
          description: If present, exactly provider-profiles/{firebaseUid}/profile.jpg.
        serviceIds:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            format: uuid
        languages:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [kn, en, tcy]
        location:
          type: object
          additionalProperties: false
          required: [locality, district, languageCode]
          properties:
            locality:
              type: string
              minLength: 1
              maxLength: 120
            taluk:
              type: [string, 'null']
              maxLength: 120
            district:
              type: string
              minLength: 1
              maxLength: 120
            languageCode:
              type: string
              enum: [en, kn]
        workingHours:
          type: array
          minItems: 7
          maxItems: 7
          description: Weekday 0 is Sunday; include each weekday exactly once and at least one open day.
          items:
            $ref: '#/components/schemas/ProviderWorkingHour'
    ProviderWorkingHour:
      type: object
      additionalProperties: false
      required: [weekday, isClosed, opensAt, closesAt]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
        isClosed:
          type: boolean
        opensAt:
          type: [string, 'null']
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
        closesAt:
          type: [string, 'null']
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Closed days require null times. Open days require a valid time range.
  responses:
    Unauthorized:
      description: Missing, invalid, or expired Firebase ID token.
    InvalidRequest:
      description: Request body failed validation.
